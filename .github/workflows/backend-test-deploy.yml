name: Backend Test Deployment

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-test-deployment
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Deploy test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: WasabiDriveTest-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Record deployment context
        run: |
          echo "Git SHA: $GITHUB_SHA"
          echo "Stage: test"
          echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Export release SHA for deployment
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy test
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          RELEASE_SHA: ${{ env.RELEASE_SHA }}

          WASABI_SERVICE_URL: ${{ vars.WASABI_SERVICE_URL }}
          WASABI_REGION: ${{ vars.WASABI_REGION }}
          WASABI_ACCESS_KEY_ID: ${{ secrets.WASABI_ACCESS_KEY_ID }}
          WASABI_SECRET_ACCESS_KEY: ${{ secrets.WASABI_SECRET_ACCESS_KEY }}
          WASABI_INTERNAL_BUCKETS: ${{ vars.WASABI_INTERNAL_BUCKETS }}

          THUMBNAIL_API_ENABLED: ${{ vars.THUMBNAIL_API_ENABLED || 'false' }}
          THUMBNAIL_API_SOURCE_BUCKET: ${{ secrets.THUMBNAIL_API_SOURCE_BUCKET }}
          THUMBNAIL_API_SOURCE_REGION: ${{ vars.THUMBNAIL_API_SOURCE_REGION }}
          THUMBNAIL_API_SOURCE_PREFIX: ${{ secrets.THUMBNAIL_API_SOURCE_PREFIX }}
          THUMBNAIL_API_DERIVED_BUCKET: ${{ vars.THUMBNAIL_API_DERIVED_BUCKET }}
          THUMBNAIL_API_DERIVED_REGION: ${{ vars.THUMBNAIL_API_DERIVED_REGION }}
          THUMBNAIL_API_ALLOWED_KEYS: ${{ secrets.THUMBNAIL_API_ALLOWED_KEYS }}
          THUMBNAIL_API_READ_ACCESS_KEY_ID: ${{ secrets.THUMBNAIL_API_READ_ACCESS_KEY_ID }}
          THUMBNAIL_API_READ_SECRET_ACCESS_KEY: ${{ secrets.THUMBNAIL_API_READ_SECRET_ACCESS_KEY }}
          THUMBNAIL_API_URL_TTL_SECONDS: ${{ vars.THUMBNAIL_API_URL_TTL_SECONDS || '3600' }}

          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_API_CLIENT_ID: ${{ vars.ENTRA_API_CLIENT_ID }}
          ENTRA_REQUIRED_SCOPE: ${{ vars.ENTRA_REQUIRED_SCOPE }}
          ENTRA_TRUSTED_USER_OBJECT_IDS: ${{ vars.ENTRA_TRUSTED_USER_OBJECT_IDS }}
        run: |
          DEPLOYMENT_STAGE=test node -e 'require("./src/config")'
          npm run deploy:test

      - name: Verify deployed API
        env:
          INTEGRATION_TARGET: test
          BASE_URL: ${{ vars.INTEGRATION_BASE_URL }}
        run: npm run test:integration -- deployment-smoke
