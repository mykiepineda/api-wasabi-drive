service: api-wasabi-drive
frameworkVersion: "3"
useDotenv: true
provider:
  name: aws
  runtime: nodejs16.x
  stage: prd
  region: ap-southeast-2
  endpointType: regional
functions:
  app:
    handler: src/app.handler
    description: "Returns information about my Wasabi cloud storage"
    events:
      - http: # this is an API Gateway HTTP event trigger
          path: /
          method: ANY
          cors: true
      - http: # all routes get proxied to the Express router
          path: /{proxy+}
          method: ANY
          cors: true
    environment:
      WASABI_SERVICE_URL: ${env:WASABI_SERVICE_URL}
      WASABI_ACCESS_KEY_ID: ${env:WASABI_ACCESS_KEY_ID}
      WASABI_SECRET_ACCESS_KEY: ${env:WASABI_SECRET_ACCESS_KEY}
      MONGODB_ATLAS_URI: ${env:MONGODB_ATLAS_URI}
