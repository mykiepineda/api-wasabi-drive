service: api-wasabi-drive
frameworkVersion: "~4.42.0"
provider:
  name: aws
  runtime: nodejs24.x
  stage: ${opt:stage}
  region: ap-southeast-2
  endpointType: regional
functions:
  app:
    handler: src/app.handler
    description: "Returns information about my Wasabi cloud storage"
    events:
      - http: # this is an API Gateway HTTP event trigger
          path: /
          method: ANY
          cors: true
      - http: # all routes get proxied to the Express router
          path: /{proxy+}
          method: ANY
          cors: true
    environment:
      DEPLOYMENT_STAGE: ${self:provider.stage}
      RELEASE_SHA: ${env:RELEASE_SHA}
      WASABI_SERVICE_URL: ${env:WASABI_SERVICE_URL}
      WASABI_REGION: ${env:WASABI_REGION}
      WASABI_ACCESS_KEY_ID: ${env:WASABI_ACCESS_KEY_ID}
      WASABI_SECRET_ACCESS_KEY: ${env:WASABI_SECRET_ACCESS_KEY}
      WASABI_INTERNAL_BUCKETS: ${env:WASABI_INTERNAL_BUCKETS, ''}
      THUMBNAIL_API_ENABLED: ${env:THUMBNAIL_API_ENABLED, 'false'}
      THUMBNAIL_API_SOURCE_BUCKET: ${env:THUMBNAIL_API_SOURCE_BUCKET, ''}
      THUMBNAIL_API_SOURCE_REGION: ${env:THUMBNAIL_API_SOURCE_REGION, ''}
      THUMBNAIL_API_SOURCE_PREFIX: ${env:THUMBNAIL_API_SOURCE_PREFIX, ''}
      THUMBNAIL_API_DERIVED_BUCKET: ${env:THUMBNAIL_API_DERIVED_BUCKET, ''}
      THUMBNAIL_API_DERIVED_REGION: ${env:THUMBNAIL_API_DERIVED_REGION, ''}
      THUMBNAIL_API_ALLOWED_KEYS: ${env:THUMBNAIL_API_ALLOWED_KEYS, ''}
      THUMBNAIL_API_READ_ACCESS_KEY_ID: ${env:THUMBNAIL_API_READ_ACCESS_KEY_ID, ''}
      THUMBNAIL_API_READ_SECRET_ACCESS_KEY: ${env:THUMBNAIL_API_READ_SECRET_ACCESS_KEY, ''}
      THUMBNAIL_API_URL_TTL_SECONDS: ${env:THUMBNAIL_API_URL_TTL_SECONDS, '3600'}
      ENTRA_TENANT_ID: ${env:ENTRA_TENANT_ID}
      ENTRA_API_CLIENT_ID: ${env:ENTRA_API_CLIENT_ID}
      ENTRA_REQUIRED_SCOPE: ${env:ENTRA_REQUIRED_SCOPE}
      ENTRA_TRUSTED_USER_OBJECT_IDS: ${env:ENTRA_TRUSTED_USER_OBJECT_IDS}
